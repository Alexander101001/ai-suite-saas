name: Daily Money Actions

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  workflow_dispatch:  # Manual trigger

jobs:
  outreach:
    runs-on: ubuntu-latest
    steps:
      - name: Check Product Hunt
        run: |
          echo "🔍 Checking Product Hunt for similar products..."
          curl -s "https://www.producthunt.com/topics/artificial-intelligence" > /dev/null
          echo "✅ Done"
      
      - name: Send Telegram Update
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TG_CHAT }}" \
            -d "text=🤖 AI Suite running. Visitors: ${{ github.event.repository.stargazers_count }}"
